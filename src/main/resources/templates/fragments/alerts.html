<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="alerts" th:fragment="messages">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}" role="status"></div>
    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}" role="alert"></div>
    <div class="alert alert-error" th:if="${param.error}" role="alert">Email atau kata sandi tidak cocok.</div>
    <div class="alert alert-error" th:if="${param.expired}" role="alert">Sesi kamu berakhir karena perubahan akses. Silakan masuk kembali.</div>
    <div class="alert alert-success" th:if="${param.logout}" role="status">Kamu berhasil keluar.</div>
</div>
</body>
</html>
