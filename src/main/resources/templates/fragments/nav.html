<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="siteNav">
    <a class="brand" th:href="@{/}" aria-label="FindIt Campus beranda">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span>findit<span class="brand-dot">.</span><small> CAMPUS</small></span>
    </a>
    <nav class="main-nav" aria-label="Navigasi utama">
        <a th:href="@{/reports}">Jelajahi</a>
        <a th:if="${currentUser != null}" th:href="@{/my-reports}">Laporan saya</a>
        <a th:if="${currentUser != null}" th:href="@{/claims}">Klaim</a>
        <a th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}" th:href="@{/admin}">Admin</a>
    </nav>
    <div class="nav-actions">
        <a th:if="${currentUser == null}" class="nav-login" th:href="@{/login}">Masuk</a>
        <a th:if="${currentUser == null}" class="button button-small" th:href="@{/register}">Buat akun</a>
        <span th:if="${currentUser != null}" class="user-greeting" th:text="${currentUser.fullName}">Nama</span>
        <form th:if="${currentUser != null}" th:action="@{/logout}" method="post">
            <button class="nav-login button-link" type="submit">Keluar</button>
        </form>
    </div>
</header>
</body>
</html>
